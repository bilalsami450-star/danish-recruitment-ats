<style>
:root{--ink:#151515;--muted:#6e6e68;--line:#deded7;--paper:#f4f3ed;--white:#fff;--green:#153f35;--green2:#285e50;--soft:#edf4f0;--shadow:0 14px 36px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}.topbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;background:rgba(244,243,237,.96);position:sticky;top:0;z-index:20}
.brand{font-weight:850;letter-spacing:-.04em}.brand span{font-weight:500;color:var(--muted);margin-left:10px;font-size:12px}.tag{padding:7px 9px;border:1px solid #d7d7d0;border-radius:99px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:800}
.page{padding:5vw;min-height:calc(100vh - 66px)}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:850}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:7vw;align-items:end;margin:4vh 0 7vh}.hero h1{font-family:Georgia,serif;font-size:clamp(50px,7vw,100px);line-height:.9;letter-spacing:-.06em;margin:0;font-weight:500}.hero p{font-size:17px;line-height:1.6;color:#55534d}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:32px 0 18px}.section-head h2{font-size:36px;letter-spacing:-.05em;margin:5px 0}.sub{color:#77756e;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.domain-card,.role-card,.cat-card{background:#fff;border:1px solid var(--line);padding:22px;text-align:left;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;transition:.18s}.domain-card:hover,.role-card:hover,.cat-card:hover,.active-card{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#9aa99f}
.domain-card.health{background:var(--soft);border-color:#c9d9d2}.num{font-family:Georgia,serif;font-size:42px;color:#aaa79d}.domain-card h3,.role-card h3,.cat-card h3{font-size:24px;margin:8px 0;letter-spacing:-.035em}.badge{display:inline-block;width:max-content;padding:5px 8px;background:var(--green);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-top:7px}.open{font-weight:850;margin-top:22px}
.breadcrumbs{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:30px}.breadcrumbs a{color:#4d5e58;text-decoration:none;font-weight:750}.breadcrumbs a:hover{text-decoration:underline}.crumb-sep{color:#aaa}
.health-shell{background:#eef5f1;min-height:100vh}.health-shell .topbar{background:#123a32;color:#fff;border-color:#275249}.health-shell .brand span{color:#a9c3bb}.health-shell .tag{border-color:#56776e}.health-page{padding:34px 5vw 60px}
.role-card{min-height:230px;border-top:4px solid var(--green2)}.role-code{font-family:Georgia,serif;font-size:54px;color:var(--green2);line-height:1}.role-card .stats{font-size:12px;color:#777;margin-top:12px}
.cat-card{min-height:160px}.cat-card .count{font-size:30px;font-weight:900;color:var(--green2);margin-top:16px}.cat-card small{color:#777;line-height:1.4}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.metric{background:#fff;border:1px solid #dbe5e0;border-top:3px solid var(--green2);padding:18px}.metric strong{font-size:29px;display:block}.metric span{font-size:12px;color:#777}
.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:11px 13px;border:1px solid #d2ddd7;background:#fff}.select{padding:11px;border:1px solid #d2ddd7;background:#fff}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.11em;font-weight:900;margin:28px 0 12px}
.pipeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:10px;overflow-x:auto;padding-bottom:16px}.col{background:#dfeae5;min-height:260px;padding:12px}.colhead{display:flex;justify-content:space-between;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.candidate{background:#fff;border:1px solid #d8e0dc;border-left:3px solid #4b806f;padding:14px;margin-bottom:9px;cursor:pointer}.candidate:hover{box-shadow:0 8px 24px rgba(0,0,0,.08)}.candidate b{display:block;margin-bottom:4px}.candidate small{color:#777;line-height:1.5}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{font-size:10px;background:#f0f3f1;padding:4px 6px;border-radius:2px;color:#555}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid #eee}.source-link{font-size:11px;font-weight:850;color:#1769aa;text-decoration:none}.license-link{color:#2c6b54}.source-link:hover{text-decoration:underline}
.status-line{font-size:11px;margin-top:9px}.status-line b{display:inline;font-size:11px}.proofbar{background:#173f35;color:#fff;padding:14px 16px;margin:0 0 22px;font-size:13px;display:flex;justify-content:space-between;gap:15px;align-items:center}.proofbar span{opacity:.8}
.drawer{position:fixed;right:0;top:0;height:100vh;width:min(580px,95vw);background:#fff;z-index:50;box-shadow:-20px 0 50px rgba(0,0,0,.14);padding:28px;transform:translateX(105%);transition:.25s;overflow:auto}.drawer.open{transform:translateX(0)}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}.overlay.open{display:block}.close{float:right;border:0;background:#eee;width:34px;height:34px;border-radius:50%}.drawer h2{font-size:32px;margin:10px 0 4px}.drawer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.detail{padding:12px;background:#f5f5f1}.detail small{display:block;color:#777;text-transform:uppercase;font-size:9px;letter-spacing:.08em}.detail b{display:block;margin-top:4px}.drawer-links{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.drawer-links a{padding:10px 12px;border:1px solid #ccd8d2;text-decoration:none;color:#174c3f;font-weight:800;font-size:12px}.privacy{font-size:11px;color:#888;margin-top:24px;border-top:1px solid #eee;padding-top:14px}
.share{border:1px solid #b9c9c2;background:#fff;padding:9px 12px;font-weight:800;font-size:12px}.share-note{font-size:11px;color:#678078;margin-left:8px}
.demo{padding:5vw}.demo-box{background:#fff;border:1px solid var(--line);padding:30px;max-width:760px}.demo-box h1{font-size:45px;margin:8px 0}
@media(max-width:800px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.section-head{display:block}.proofbar{display:block}.proofbar span{display:block;margin-top:5px}.drawer-grid{grid-template-columns:1fr}}
@media(max-width:550px){.page,.health-page{padding:26px 18px}.metrics{grid-template-columns:1fr 1fr}.brand span{display:none}.grid{grid-template-columns:1fr}}
</style>
</head>

 const isOT=roleId==="ot";
 root.className="health-shell";
 root.innerHTML=header(true)+`<main class="health-page">${breadcrumbs(["healthcare",roleId])}<div class="section-head"><div><div class="eyebrow">${esc(r.code)} sourcing project</div><h2>${esc(r.title)}</h2><div class="sub">${esc(r.subtitle)}</div></div><div><button class="share" onclick="copyLink()">Copy Role Link</button><span id="copyNote" class="share-note"></span></div></div><div class="section-title">Candidate categories</div><section class="grid">${r.categories.map(c=>`<button class="cat-card ${c.id===cat.id?"active-card":""}" onclick="go('healthcare/${roleId}/${c.id}')"><div><h3>${esc(c.label)}</h3><small>${esc(c.desc)}</small></div><div><div class="count">${c.count}</div><small>candidate profiles</small></div></button>`).join("")}</section><div class="metrics"><div class="metric"><strong>${candidates.length}</strong><span>Candidate profiles</span></div><div class="metric"><strong>${linkedinCount}</strong><span>LinkedIn profiles</span></div><div class="metric"><strong>${licenseCount}</strong><span>License links available</span></div><div class="metric"><strong>${candidates.filter(c=>c.status==="Contacted").length}</strong><span>Candidates contacted</span></div></div><div class="toolbar"><input class="search" id="search" placeholder="Search candidate, city, speciality…" oninput="filterCards()"><select class="select" id="statusFilter" onchange="filterCards()"><option value="">All candidate statuses</option>${[...new Set(candidates.map(c=>c.status))].sort().map(s=>`<option>${esc(s)}</option>`).join("")}</select></div>${isOT?otWorkflowBoard(candidates,cat):standardPipeline(candidates,cat)}</main>`;
}
function standardPipeline(candidates,cat){
 return `<div class="section-title">${esc(cat.label)} — sourcing pipeline</div><div class="pipeline">${STAGES.map(st=>pipelineColumn(st,candidates)).join("")}</div>`;
}
function otWorkflowBoard(candidates,cat){
 const milestones=[
   {label:"Profile Researched",items:candidates},
   {label:"License Record Found",items:candidates.filter(c=>c.licenseUrl)},
   {label:"Contractor Confirmed",items:candidates.filter(c=>c.contractor==="Yes")},
   {label:"Contacted",items:candidates.filter(c=>c.status==="Contacted")},
   {label:"Awaiting Connection",items:candidates.filter(c=>(c.notes||"").toLowerCase().includes("waiting for the connection"))}
 ];
 return `<div class="section-title">${esc(cat.label)} — sourcing workflow evidence</div><div class="sub" style="font-size:12px;margin:-4px 0 14px">Each column represents a documented sourcing milestone. A candidate may appear in more than one column because these are workflow evidence views, not mutually exclusive status stages.</div><div class="pipeline">${milestones.map(m=>milestoneColumn(m.label,m.items)).join("")}</div>`;
}
function milestoneColumn(label,items){
 return `<div class="col"><div class="colhead"><span>${esc(label)}</span><span>${items.length}</span></div>${items.length?items.map(candidateCard).join(""):'<div class="sub" style="padding:10px">No candidates</div>'}</div>`;
}
function pipelineColumn(stage,candidates){
 const arr=candidates.filter(c=>c.stage===stage);
 return `<div class="col"><div class="colhead"><span>${esc(stage)}</span><span>${arr.length}</span></div>${arr.length?arr.map(candidateCard).join(""):'<div class="sub" style="padding:10px">No candidates</div>'}</div>`;
}
function candidateCard(c){
 const links=`<div class="links">${c.linkedin?`<a class="source-link" href="${esc(c.linkedin)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">LinkedIn ↗</a>`:""}${c.licenseUrl?`<a class="source-link license-link" href="${esc(c.licenseUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">License ↗</a>`:""}</div>`;
 return `<div class="candidate" data-search="${esc((c.name+" "+c.location+" "+c.speciality).toLowerCase())}" data-status="${esc(c.status)}" onclick='openCandidate(${JSON.stringify(c.roleCode)},${JSON.stringify(c.name)})'><b>${esc(c.name)}</b><small>${esc(c.location)} · ${esc(c.setting)}</small><div class="status-line">Candidate Status: <b>${esc(c.status)}</b></div><div class="pills"><span class="pill">${esc(c.experience)}</span><span class="pill">${esc(c.licenseStatus)}</span></div>${links}</div>`;
}
function openCandidate(roleCode,name){
 let role=Object.values(DATA.healthcare.roles).find(r=>r.code===roleCode);let c=role?.candidates.find(x=>x.name===name);if(!c)return;
 document.getElementById("drawer").innerHTML=`<button class="close" onclick="closeDrawer()">×</button><div class="eyebrow">${esc(c.roleCode)} candidate profile</div><h2>${esc(c.name)}</h2><div class="sub">${esc(c.role)} · ${esc(c.location)}</div><div class="drawer-links">${c.linkedin?`<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">View LinkedIn Profile ↗</a>`:""}${c.licenseUrl?`<a href="${esc(c.licenseUrl)}" target="_blank" rel="noopener">License Verification ↗</a>`:""}</div><div class="drawer-grid"><div class="detail"><small>Candidate Status</small><b>${esc(c.status)}</b></div><div class="detail"><small>Pipeline Stage</small><b>${esc(c.stage)}</b></div><div class="detail"><small>Experience</small><b>${esc(c.experience)}</b></div><div class="detail"><small>Setting</small><b>${esc(c.setting)}</b></div><div class="detail"><small>License Status</small><b>${esc(c.licenseStatus)}</b></div><div class="detail"><small>Outreach / Research Date</small><b>${esc(c.outreachDate)}</b></div></div><div class="section-title">Speciality / profile evidence</div><div class="detail"><b>${esc(c.speciality)}</b></div>${c.contractor?`<div class="section-title">Independent Contractor</div><div class="detail"><b>${esc(c.contractor)}</b></div>`:""}<div class="section-title">Recruiter Notes</div><p class="sub">${esc(c.notes)}</p><div class="privacy">Email addresses and phone numbers are intentionally hidden from this public work sample.</div>`;
 document.getElementById("drawer").classList.add("open");document.getElementById("overlay").classList.add("open");
}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");document.getElementById("overlay").classList.remove("open")}
function filterCards(){let q=(document.getElementById("search")?.value||"").toLowerCase();let st=document.getElementById("statusFilter")?.value||"";document.querySelectorAll(".candidate").forEach(el=>el.style.display=(el.dataset.search.includes(q)&&(!st||el.dataset.status===st))?"block":"none")}
async function copyLink(){try{await navigator.clipboard.writeText(location.href);let n=document.getElementById("copyNote");if(n){n.textContent="Link copied";setTimeout(()=>n.textContent="",1800)}}catch(e){}}
function demoPage(id){
 let d=DATA.demoDomains[id];if(!d){landing();return}
 root.className="";
 root.innerHTML=header()+`<main class="page">${breadcrumbs([id])}<div class="section-head"><div><div class="eyebrow">Portfolio workspace · fictional demo</div><h2>${esc(d.label)}</h2><div class="sub">${esc(d.subtitle)}</div></div><button class="share" onclick="copyLink()">Copy Workspace Link</button></div><div class="metrics">${d.metrics.map(m=>`<div class="metric"><strong>${m[0]}</strong><span>${m[1]}</span></div>`).join("")}</div><div class="section-title">Recruitment pipeline</div><div class="pipeline">${d.stages.map(st=>`<div class="col"><div class="colhead"><span>${esc(st)}</span><span>${d.candidates.filter(c=>c.stage===st).length}</span></div>${d.candidates.filter(c=>c.stage===st).map(c=>`<div class="candidate"><b>${esc(c.name)}</b><small>${esc(c.role)}<br>${esc(c.city)}</small><div class="pills"><span class="pill">${esc(c.evidence)}</span></div></div>`).join("")||'<div class="sub" style="padding:10px">No candidates</div>'}</div>`).join("")}</div><p class="sub" style="font-size:12px;margin-top:22px">This workspace uses fictional demo candidate data to demonstrate ATS workflow and organization.</p></main>`;
}
function renderRoute(){closeDrawer();let p=routeParts();if(!p.length){landing();return}if(p[0]==="healthcare"){if(!p[1])healthcareHome();else rolePage(p[1],p[2]||"all");return}demoPage(p[0])}
window.addEventListener("hashchange",renderRoute);window.addEventListener("DOMContentLoaded",renderRoute);
</script></body></html>
